<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg2" cx="20%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#101a33"/>
      <stop offset="55%" stop-color="#0a0e1a"/>
    </radialGradient>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a94a8"/>
    </marker>
  </defs>
  <rect width="1000" height="380" fill="url(#bg2)"/>
  <text x="40" y="45" fill="#e8ecf5" font-family="Segoe UI, sans-serif" font-weight="700" font-size="22">Emotion → Music Mood Map</text>
  <text x="40" y="68" fill="#8a94a8" font-family="Segoe UI, sans-serif" font-size="13">config.EMOTION_MUSIC_MAP — defined once, used by MusicPlayer and the Home dashboard</text>

  <!-- Happy -->
  <circle cx="140" cy="160" r="46" fill="rgba(255,213,79,0.12)" stroke="#ffd54f" stroke-width="2"/>
  <text x="140" y="153" fill="#ffd54f" text-anchor="middle" font-size="26">😄</text>
  <text x="140" y="178" fill="#e8ecf5" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="700" font-size="14">Happy</text>
  <path d="M186,160 H300" stroke="#8a94a8" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="300" y="135" width="150" height="50" rx="10" fill="rgba(255,213,79,0.08)" stroke="rgba(255,213,79,0.3)"/>
  <text x="375" y="165" fill="#ffd54f" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="700" font-size="14">songs/happy/</text>

  <!-- Sad -->
  <circle cx="140" cy="250" r="46" fill="rgba(79,195,247,0.12)" stroke="#4fc3f7" stroke-width="2"/>
  <text x="140" y="243" fill="#4fc3f7" text-anchor="middle" font-size="26">😢</text>
  <text x="140" y="268" fill="#e8ecf5" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="700" font-size="14">Sad</text>
  <path d="M186,250 H300" stroke="#8a94a8" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="300" y="225" width="150" height="50" rx="10" fill="rgba(79,195,247,0.08)" stroke="rgba(79,195,247,0.3)"/>
  <text x="375" y="255" fill="#4fc3f7" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="700" font-size="14">songs/motivation/</text>

  <!-- Angry -->
  <circle cx="140" cy="70" r="46" fill="rgba(255,82,82,0.12)" stroke="#ff5252" stroke-width="2"/>
  <text x="140" y="63" fill="#ff5252" text-anchor="middle" font-size="26">😠</text>
  <text x="140" y="88" fill="#e8ecf5" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="700" font-size="14">Angry</text>
  <path d="M186,70 H300" stroke="#8a94a8" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="300" y="45" width="150" height="50" rx="10" fill="rgba(255,82,82,0.08)" stroke="rgba(255,82,82,0.3)"/>
  <text x="375" y="75" fill="#ff5252" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="700" font-size="14">songs/calm/</text>

  <!-- Neutral -->
  <circle cx="140" cy="330" r="40" fill="rgba(176,190,197,0.12)" stroke="#b0bec5" stroke-width="2"/>
  <text x="140" y="323" fill="#b0bec5" text-anchor="middle" font-size="22">😐</text>
  <text x="140" y="345" fill="#e8ecf5" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13">Neutral</text>
  <path d="M180,330 H300" stroke="#8a94a8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow2)"/>
  <text x="320" y="335" fill="#8a94a8" font-family="Segoe UI, sans-serif" font-size="13">no auto-play (by design)</text>

  <!-- Right side: playback engine -->
  <rect x="540" y="90" width="420" height="220" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
  <text x="565" y="125" fill="#00e5ff" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13" letter-spacing="1">MUSICPLAYER ENGINE</text>
  <text x="565" y="155" fill="#e8ecf5" font-family="Segoe UI, sans-serif" font-size="13">1. Switches only when mood changes</text>
  <text x="565" y="180" fill="#e8ecf5" font-family="Segoe UI, sans-serif" font-size="13">   (jittery predictions don't restart songs)</text>
  <text x="565" y="210" fill="#e8ecf5" font-family="Segoe UI, sans-serif" font-size="13">2. Random pick, never repeats the</text>
  <text x="565" y="235" fill="#e8ecf5" font-family="Segoe UI, sans-serif" font-size="13">   previous track in the same mood</text>
  <text x="565" y="265" fill="#e8ecf5" font-family="Segoe UI, sans-serif" font-size="13">3. pygame.mixer.music playback +</text>
  <text x="565" y="290" fill="#e8ecf5" font-family="Segoe UI, sans-serif" font-size="13">   volume / pause / elapsed-time control</text>

  <path d="M450,160 Q500,160 540,160" stroke="#00e5ff" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
</svg>
